name: Permanent Linux SSH Server

on:
  schedule:
    - cron: '0 */6 * * *'  # روشن شدن خودکار هر ۶ ساعت یک‌بار (۲۴/۷)
  workflow_dispatch:        # استارت دستی با دکمه Run

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      # بازیابی هارد ابری دائمی
      - name: 2. Restore Persistent Workspace
        uses: actions/cache@v4
        with:
          path: /home/commander04/workspace
          key: cynet-ssh-workspace-${{ github.run_id }}
          restore-keys: |
            cynet-ssh-workspace-

      - name: 3. Setup OpenSSH Server
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          
          # فعال‌سازی لاگین با پسورد
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo systemctl restart ssh

      - name: 4. Create User (commander04) with Root Access
        run: |
          sudo useradd -m -s /bin/bash commander04 || true
          echo "commander04:commander04" | sudo chpasswd
          sudo usermod -aG sudo commander04
          echo "commander04 ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/commander04
          
          # ساخت و مجوز پوشه هارد دائمی
          sudo mkdir -p /home/commander04/workspace
          sudo chown -R commander04:commander04 /home/commander04/workspace

      # قرار دادن OpenAI API Key روی ماشین
      - name: 5. Configure OpenAI API Key
        run: |
          sudo mkdir -p /etc/commander
          printf "%s" "$OPENAI_API_KEY" | sudo tee /etc/commander/openai_api_key > /dev/null
          sudo chmod 600 /etc/commander/openai_api_key
          sudo chown root:root /etc/commander/openai_api_key

      - name: 6. Connect Tailscale VPN & Show Access Info
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey="$TAILSCALE_AUTHKEY" --hostname="cynet-linux-ssh"
          
          TS_IP=$(tailscale ip -4)
          
          echo "=================================================="
          echo "  >>> PERMANENT LINUX SSH SERVER IS LIVE! <<<"
          echo "  Tailscale IP  : $TS_IP"
          echo "  Username      : commander04"
          echo "  Password      : commander04"
          echo "  ------------------------------------------------"
          echo "  💻 Connect via Terminal / CMD:"
          echo "  >> ssh commander04@$TS_IP"
          echo "  ------------------------------------------------"
          echo "  💾 Persistent Folder : /home/commander04/workspace"
          echo "=================================================="

      - name: 7. Server Keep-Alive (5h 55m)
        run: |
          for i in {1..355}; do
            sleep 60
            echo "[$i/355] Linux SSH Server is active..."
          done

      # ذخیره خودکار فایل‌های پوشه دائمی قبل از ری‌استارت
      - name: 8. Save Workspace to Cloud
        uses: actions/cache@v4
        if: always()
        with:
          path: /home/commander04/workspace
          key: cynet-ssh-workspace-${{ github.run_id }}
